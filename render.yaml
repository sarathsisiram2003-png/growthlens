# Render blueprint for the API. The frontend deploys separately on Vercel (see docs/DEPLOY.md).
#
# Free plan, no persistent disk: results, caches and the job database live in the container and are wiped on every
# deploy/restart (free services also sleep after ~15 min idle, so the first request after a pause is slow). The demo
# cities always work because they ship in the repository and are reinstalled at every start.
# To keep results across restarts: set `plan: starter` and add
#   disk: { name: growthlens-data, mountPath: /data, sizeGB: 2 }
services:
  - type: web
    name: growthlens-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "true"
      - key: HTTP_USER_AGENT
        value: GrowthLens/0.1 (portfolio project)
      - key: CORS_ORIGINS
        sync: false          # set to your Vercel URL, e.g. https://growthlens.vercel.app
      - key: EE_PROJECT
        sync: false
      - key: EE_SERVICE_ACCOUNT_JSON
        sync: false          # the whole service-account key JSON
      - key: GEMINI_API_KEY
        sync: false
